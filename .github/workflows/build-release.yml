name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opsec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all Minecraft versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build all versions
        run: ./gradlew --no-daemon buildAll

      - name: Collect JARs
        shell: bash
        run: |
          mkdir -p release-artifacts
          find . -type f -path '*/build/libs/*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} release-artifacts/ \;
          test -n "$(find release-artifacts -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opsec-jars
          path: release-artifacts/*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub pre-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: opsec-jars
          path: release-artifacts

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpSec ${{ github.ref_name }}"
          prerelease: true
          generate_release_notes: true
          files: release-artifacts/*.jar
